[project]
name = "talk-to-your-building"
version = "0.1.0"
description = "Building data, calculation tools and agent for Talk to Your Building"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.1.0",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "pydantic>=2.14.1",
    "shapely>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchmark", "building_db"]

[tool.ruff]
line-length = 120
