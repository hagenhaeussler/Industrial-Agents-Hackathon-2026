[project]
name = "track01-student-kit"
version = "1.1.0"
description = "Track 01 building data and agent evaluation tools"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.1.0",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "shapely>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchmark"]
