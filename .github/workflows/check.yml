name: Integrated checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHON_DOTENV_DISABLED: '1'
      ANTHROPIC_API_KEY: ''
      ELEVENLABS_API_KEY: ''
      OPENAI_API_KEY: ''
      TYB_CHAT_BUDGET_USD: '0'
      MPLCONFIGDIR: /tmp/tyb-matplotlib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.12'
          enable-cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Install frozen dependencies
        run: |
          uv sync --frozen
          (cd web/app && bun install --frozen-lockfile)
      - name: Integrated offline checks
        run: scripts/check.sh
      - name: Core geometry and tool-level solver acceptance
        run: |
          uv run python -m core.check_geometry data/dev
          uv run python -m core.evaluate data/dev data/train --check structured
          uv run python -m bench.validate_submission submissions/test_answers.csv data/test/submission_template.csv
      - name: Real HTTP, WebSocket and restart rehearsal
        run: uv run python scripts/check_live_integration.py --output agent_output/reports/ci-live-integration.json
      - name: Sunday-format rehearsal on a known dev building
        run: |
          mkdir -p agent_output/reports/ci-sunday
          uv run python -m bench.run_benchmark --make-questions data/dev/proc-factory-dev-003 agent_output/reports/ci-sunday/questions.json
          uv run python -m bench.run_benchmark data/dev/proc-factory-dev-003 agent_output/reports/ci-sunday/questions.json agent_output/reports/ci-sunday/answers.json --csv agent_output/reports/ci-sunday/answers.csv
          python - <<'PY'
          import json
          from pathlib import Path
          answers = json.loads(Path('agent_output/reports/ci-sunday/answers.json').read_text())['answers']
          assert len(answers) == 15
          assert all(item['error'] is None and item['answer_text'].startswith('Answer:') for item in answers)
          print('Sunday-format rehearsal: 15 answered, no errors.')
          PY
      - name: Build production image
        run: docker build -t tyb-rehearsal .
      - name: Empty-volume production smoke
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f tyb-rehearsal >/dev/null 2>&1 || true; docker volume rm tyb-rehearsal-state >/dev/null 2>&1 || true' EXIT
          docker volume create tyb-rehearsal-state
          docker run -d --name tyb-rehearsal -p 127.0.0.1:8000:8000 \
            -v tyb-rehearsal-state:/state \
            -e RAILWAY_GIT_COMMIT_SHA="$GITHUB_SHA" \
            -e TYB_CHAT_BUDGET_USD=0 \
            -e TYB_ADMIN_TOKEN=isolated-ci-admin \
            tyb-rehearsal
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health > /tmp/tyb-health.json; then break; fi
            sleep 1
          done
          python - <<'PY'
          import csv, json, os, urllib.request
          from pathlib import Path
          with urllib.request.urlopen('http://127.0.0.1:8000/health') as response:
              health = json.load(response)
          assert health['ok'] and health['state_dir_writable']
          assert health['commit'] == os.environ['GITHUB_SHA']
          with Path('data/manifest.csv').open() as source:
              kit_buildings = len(list(csv.DictReader(source)))
          assert health['buildings'] == kit_buildings + 1
          with urllib.request.urlopen('http://127.0.0.1:8000/desk') as response:
              assert response.status == 200 and 'text/html' in response.headers['content-type']
          with urllib.request.urlopen('http://127.0.0.1:8000/api/buildings/proc-factory-dev-003') as response:
              snapshot = json.load(response)
          assert snapshot['building']['building']['id'] == 'proc-factory-dev-003'
          assert len(snapshot['building']['floors']) == 2 and snapshot['building']['assets']
          assert snapshot['derived']['anchors'] and snapshot['building_version'] == 0
          with urllib.request.urlopen('http://127.0.0.1:8000/api/colab/model') as response:
              colab = json.load(response)
          expected = json.loads(Path('demo/colab/building.json').read_text())
          assert colab['building'] == expected and colab['model_revision']
          assert len(colab['building']['floors']) >= 4 and colab['anchors']
          with urllib.request.urlopen('http://127.0.0.1:8000/colab') as response:
              assert response.status == 200 and 'text/html' in response.headers['content-type']
          with urllib.request.urlopen('http://127.0.0.1:8000/api/colab/wifi/status') as response:
              wifi = json.load(response)
          assert wifi['calibration_points'] == 0 and not wifi['ready']
          assert not wifi['browser_scan_supported'] and not wifi['accuracy_validated']
          print(f'Production Docker image: exact revision, empty writable volume, {kit_buildings} kit buildings plus Colab, factory snapshot, Colab model and SPA pass; no unsurveyed Wi-Fi fix.')
          PY
      - name: Upload rehearsal evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-rehearsal-${{ github.sha }}
          path: agent_output/reports/
          retention-days: 7
